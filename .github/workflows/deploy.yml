name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/github-script@v7
        with:
          script: |
            const repository = { owner: context.repo.owner, repo: context.repo.repo };
            const { data: pages } = await github.rest.repos.getPages(repository);
            if (pages.build_type !== 'workflow') {
              await github.rest.repos.updateInformationAboutPagesSite({
                ...repository,
                build_type: 'workflow',
              });
              core.info('GitHub Pages now publishes the built Actions artifact.');
            }

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SITE_URL: ${{ vars.SITE_URL }}
          VITE_GITHUB_OWNER: ${{ secrets.GITHUB_OWNER }}
          VITE_GITHUB_REPO: ${{ secrets.GITHUB_REPO }}
          VITE_GITALK_CLIENT_ID: ${{ secrets.GITALK_CLIENT_ID }}
          VITE_GITALK_CLIENT_SECRET: ${{ secrets.GITALK_CLIENT_SECRET }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
