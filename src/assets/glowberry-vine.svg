<svg xmlns="http://www.w3.org/2000/svg" class="gb-art" width="64" height="630" viewBox="0 0 64 630" style="--gb-idle:0.35" role="group" aria-label="发光浆果藤，7 枚切片">
<title>发光浆果藤 · 随机生长</title>
<desc>每片藤蔓有一至两处额外的叶簇、嫩芽或卷须。浆果悬停时在 150 毫秒内从常态亮度过渡至 85%，移开后恢复。内联 SVG 或 object 支持交互。</desc>
<style>
.gb-art .gb-base,.gb-art .gb-decoration,.gb-art .gb-berry-shape{pointer-events:none}
.gb-art .gb-berry{cursor:pointer;outline:none}
.gb-art .gb-halo{opacity:var(--gb-idle,.35);transition:opacity 150ms ease-in-out;pointer-events:none}
.gb-art .gb-hit{fill:transparent;pointer-events:all}
.gb-art .gb-touch-hit{display:none}
.gb-art .gb-focus{fill:none;stroke:#a9bb72;stroke-width:1;stroke-dasharray:2 2;opacity:0;pointer-events:none}
.gb-art .gb-berry:focus-visible .gb-halo,.gb-art .gb-berry:active .gb-halo{opacity:.85}
.gb-art .gb-berry:focus-visible .gb-focus{opacity:1}
@media(hover:hover){.gb-art .gb-berry:hover .gb-halo{opacity:.85}}
@media(pointer:coarse){.gb-art .gb-touch-hit{display:block}}
</style>
